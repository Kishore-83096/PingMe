name: PingMe CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  auth-ci:
    name: Auth Backend CI
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Secret leak scan
      # --------------------------------------------------
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 3. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t pingme-backend:ci \
            ./backend

      # --------------------------------------------------
      # 4. Python syntax check inside Docker
      # --------------------------------------------------
      - name: Check Python syntax
        run: |
          docker run --rm \
            pingme-backend:ci \
            python -m compileall -q /app

      # --------------------------------------------------
      # 5. Run Ruff linting inside Docker
      # --------------------------------------------------
      - name: Run Ruff lint
        run: |
          docker run --rm \
            pingme-backend:ci \
            ruff check /app

      # --------------------------------------------------
      # 6. Run pytest inside Docker
      # --------------------------------------------------
      - name: Run Auth tests inside Docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="redis://ci-test:6379" \
            pingme-backend:ci \
            python -m pytest -v



      # --------------------------------------------------
      # 7. Verify Flask application can be created
      # --------------------------------------------------
      - name: Verify Flask application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            pingme-backend:ci \
            python -c "from app import create_app; app=create_app(); print(app.url_map)"

      # --------------------------------------------------
      # 8. Docker image information
      # --------------------------------------------------
      - name: Verify Docker image
        run: |
          docker image inspect pingme-backend:ci > /dev/null

      # --------------------------------------------------
      # 9. Final status
      # --------------------------------------------------
      - name: CI completed successfully
        run: |
          echo "PingMe Auth CI passed successfully."
