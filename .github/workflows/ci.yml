name: PingMe CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  auth-health-test:
    name: Auth Health Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t pingme-backend:stage1 \
            ./backend

      - name: Run Auth tests inside Docker
        run: |
          docker run --rm \
            pingme-backend:stage1 \
            python -m pytest -v