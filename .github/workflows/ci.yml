name: PingMe CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  auth-ci:
    name: Auth Backend CI
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Secret leak scan
      # --------------------------------------------------
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 3. Verify .env files are not tracked
      # --------------------------------------------------
      - name: Verify environment files are not tracked
        shell: bash
        run: |
          tracked_env_files="$(git ls-files \
            'backend/.env' \
            'redis/.env' \
            'nginx/.env' \
            'frontend/.env')"

          if [ -n "$tracked_env_files" ]; then
            echo "ERROR: The following environment files are tracked by Git:"
            echo "$tracked_env_files"
            exit 1
          fi

          echo "No protected .env files are tracked."

      # --------------------------------------------------
      # 4. Build Backend Docker image
      # --------------------------------------------------
      - name: Build Backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t pingme-backend:ci \
            ./backend

      # --------------------------------------------------
      # 5. Python syntax check
      # --------------------------------------------------
      - name: Check Python syntax
        run: |
          docker run --rm \
            pingme-backend:ci \
            python -m compileall -q /app

      # --------------------------------------------------
      # 6. Run Ruff linting
      # --------------------------------------------------
      - name: Run Ruff lint
        run: |
          docker run --rm \
            pingme-backend:ci \
            ruff check /app

      # --------------------------------------------------
      # 7. Run Auth tests
      # --------------------------------------------------
      - name: Run Auth tests inside Docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="redis://ci-test:6379" \
            -e NGINX_PROXY_TOKEN="ci-test-token" \
            pingme-backend:ci \
            python -m pytest -v

      # --------------------------------------------------
      # 8. Verify Flask application
      # --------------------------------------------------
      - name: Verify Flask application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="redis://ci-test:6379" \
            -e NGINX_PROXY_TOKEN="ci-test-token" \
            pingme-backend:ci \
            python -c "from app import create_app; app=create_app(); print(app.url_map)"

      # --------------------------------------------------
      # 9. Verify Gunicorn command
      # --------------------------------------------------
      - name: Verify Gunicorn command
        run: |
          docker inspect pingme-backend:ci \
            --format '{{json .Config.Cmd}}' | grep -i gunicorn

      # --------------------------------------------------
      # 10. Start Backend container
      # --------------------------------------------------
      - name: Start Backend container
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run -d \
            --name pingme-backend-ci \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="redis://ci-test:6379" \
            -e NGINX_PROXY_TOKEN="ci-test-token" \
            -p 5000:5000 \
            pingme-backend:ci

      # --------------------------------------------------
      # 11. Verify Gunicorn startup
      # --------------------------------------------------
      - name: Verify Gunicorn startup
        shell: bash
        run: |
          sleep 3

          docker logs pingme-backend-ci

          docker logs pingme-backend-ci 2>&1 | grep -q "Starting gunicorn"
          docker logs pingme-backend-ci 2>&1 | grep -q "Listening at: http://0.0.0.0:5000"

      # --------------------------------------------------
      # 12. Stop Backend container
      # --------------------------------------------------
      - name: Stop Backend container
        if: always()
        run: |
          docker rm -f pingme-backend-ci || true

      # --------------------------------------------------
      # 13. Build Nginx Docker image
      # --------------------------------------------------
      - name: Build Nginx Docker image
        run: |
          docker build \
            -f nginx/Dockerfile \
            -t pingme-nginx:ci \
            ./nginx

      # --------------------------------------------------
      # 14. Validate Nginx configuration
      # --------------------------------------------------
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -e NGINX_PORT=8080 \
            -e BACKEND_HOST=example.com \
            -e BACKEND_PORT=443 \
            -e BACKEND_URL=https://example.com \
            -e NGINX_PROXY_TOKEN="ci-test-token" \
            pingme-nginx:ci \
            nginx -t

      # --------------------------------------------------
      # 15. Verify Backend Docker image
      # --------------------------------------------------
      - name: Verify Backend Docker image
        run: |
          docker image inspect pingme-backend:ci > /dev/null

      # --------------------------------------------------
      # 16. Verify Nginx Docker image
      # --------------------------------------------------
      - name: Verify Nginx Docker image
        run: |
          docker image inspect pingme-nginx:ci > /dev/null

      # --------------------------------------------------
      # 17. Final status
      # --------------------------------------------------
      - name: CI completed successfully
        run: |
          echo "PingMe CI passed successfully."
          echo "Backend Docker build: PASSED"
          echo "Gunicorn WSGI startup: PASSED"
          echo "Auth tests: PASSED"
          echo "Nginx Docker build: PASSED"
          echo "Nginx configuration: PASSED"
          echo "Environment protection: PASSED"
