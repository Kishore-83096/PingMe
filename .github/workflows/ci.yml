name: PingMe CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  auth-health-test:
    name: Auth Health Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/auth/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health tests
        run: pytest -v